approval_policy = "never"

allow_login_shell = false

default_permissions = "workspace-no-slash-tmp"

# project doc section

# it doesn't have to be AGENTS.md, you can input the fallback filenames here
# project_doc_fallback_filenames = ["TEAM_GUIDE.md", ".agents.md"]
# make the combined AGENTS.md/project doc be bigger
project_doc_max_bytes = 65536

#  general features block
[features]
memories = true

# memories block
[memories]
generate_memories = true
use_memories = true
disable_on_external_context = true
min_rate_limit_remaining_percent = 50

[permissions.workspace-no-slash-tmp]
extends = ":workspace"

[permissions.workspace-no-slash-tmp.filesystem]
":slash_tmp" = "read"

[permissions.workspace-no-slash-tmp.network]
enabled = false

[permissions.workspace-no-slash-tmp.filesystem.":workspace_roots"]
"current_context.md" = "read"

[shell_environment_policy]
inherit = "core"
exclude = [
    "SSH_AUTH_SOCK",
    "SSH_ASKPASS",
    "GIT_ASKPASS",
    "VSCODE_GIT_ASKPASS_*",
    "GH_TOKEN",
    "GITHUB_TOKEN",
]

[shell_environment_policy.set]
GIT_OPTIONAL_LOCKS = "0"
TMPDIR = "/workspace/.project-tmp"

# MCP blocks
# mcp-proxy exposes each installed stdio MCP as a separate Streamable HTTP
# endpoint on the private Compose network.

# Context7 provides current developer documentation.
[mcp_servers.context7]
url = "http://mcp_gateway:8080/servers/context7/mcp"
enabled = true
required = false
enabled_tools = [
    "resolve-library-id",
    "query-docs",
]
default_tools_approval_mode = "auto"
startup_timeout_sec = 20
tool_timeout_sec = 60

# Brave Search provides general internet search through a local stdio MCP
# process. BRAVE_API_KEY is supplied to mcp_gateway service through docker secret
# disabled by default due to needing api key
[mcp_servers.brave_search]
url = "http://mcp_gateway:8080/servers/brave_search/mcp"
enabled = false
required = false
enabled_tools = ["brave_web_search"]
default_tools_approval_mode = "auto"
startup_timeout_sec = 20
tool_timeout_sec = 60

# this is the mcp for official openai documentation, which includes codex manual
# this mcp is not installed locally, the agent directly access it by 
# https://developers.openai.com/mcp
[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"
enabled = true
required = false
enabled_tools = [
    "search_openai_docs",
    "fetch_openai_doc",
    "list_openai_docs",
    "get_openapi_spec",
]
default_tools_approval_mode = "auto"
startup_timeout_sec = 30
tool_timeout_sec = 60

# Self-hosted metasearch through the private SearXNG Compose service.
# searxng is a bit heavy, it involves a completely separate docker service
# still goes through the mcp_gateway
[mcp_servers.searxng]
url = "http://mcp_gateway:8080/servers/searxng/mcp"
enabled = true
required = false
enabled_tools = [
    "searxng_web_search",
]
default_tools_approval_mode = "auto"
startup_timeout_sec = 30
tool_timeout_sec = 120

# Local semantic code graph over the project repo. The index is
# stored in the gateway's writable codegraph_index named volume.
[mcp_servers.codegraph]
url = "http://mcp_gateway:8080/servers/codegraph/mcp"
enabled = true
required = false
enabled_tools = [
    "codegraph_explore",
]
default_tools_approval_mode = "auto"
startup_timeout_sec = 30
tool_timeout_sec = 120

# mcp-language-server wraps Eclipse JDT LS for Java.
# hover disabled because currently broken, you can put it back in and see
# if its working now
[mcp_servers.lsp_java]
url = "http://mcp_gateway:8080/servers/lsp_java/mcp"
enabled = true
required = false
enabled_tools = [
    "definition",
    "references",
    "diagnostics"
]
default_tools_approval_mode = "approve"
startup_timeout_sec = 120
tool_timeout_sec = 120

# mcp-language-server wraps Pyright for Python.
[mcp_servers.lsp_python]
url = "http://mcp_gateway:8080/servers/lsp_python/mcp"
enabled = false
required = false
enabled_tools = [
    "definition",
    "references",
    "diagnostics",
    "hover",
]
default_tools_approval_mode = "approve"
startup_timeout_sec = 60
tool_timeout_sec = 120

# mcp-language-server wraps typescript-language-server for JavaScript and
# TypeScript.
[mcp_servers.lsp_typescript]
url = "http://mcp_gateway:8080/servers/lsp_typescript/mcp"
enabled = false
required = false
enabled_tools = [
    "definition",
    "references",
    "diagnostics",
    "hover",
]
default_tools_approval_mode = "approve"
startup_timeout_sec = 60
tool_timeout_sec = 120

# After adding more mcp blocks here, you would add the corresponding mcp config in agentic_tools/mcp/servers.json
# if you can install an mcp locally, you should, it's more of a pain in the ass. If you're not
# installing the mcp locally, then you would just include the direct url and won't have to add
# any config to servers.json
