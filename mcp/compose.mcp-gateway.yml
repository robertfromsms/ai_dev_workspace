services:
  mcp_gateway:
    build:
      context: .
      dockerfile: ./Dockerfile.mcp
    init: true
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    privileged: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      HOME: /home/node
      PATH: /opt/mcp-python/bin:/usr/local/bin:/usr/bin:/bin
      TMPDIR: /tmp
      XDG_CACHE_HOME: /tmp/cache
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=256m,mode=1777
      - /home/node:rw,nosuid,nodev,noexec,size=64m,mode=0700,uid=1000,gid=1000
    volumes:
      - ./docker-mcp-gateway-entrypoint.sh:/etc/mcp-proxy/docker-mcp-gateway-entrypoint.sh:ro
      - ./servers.json:/etc/mcp-proxy/servers.json:ro
    secrets:
      - source: brave_api_key
        target: brave_api_key
        uid: "1000"
        gid: "1000"
        mode: "0400"
    expose:
      - "8080"

secrets:
  brave_api_key:
    file: ${BRAVE_API_KEY_FILE:-./blank_secret}