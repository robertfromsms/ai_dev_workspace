services:
  ai_dev_common:
    # this is a random number i picked between 1000 - 60000
    user: "43927:43927"
    working_dir: /workspace
     # will override any entrypoint to nothing
    entrypoint: []
    # just sleep
    command: ["sleep", "infinity"]

    init: true
    # The image's entire root filesystem is read-only.
    read_only: true
    # Do not allow privilege escalation.
    privileged: false

    # drop all root-only capabilities
    cap_drop:
      - ALL

    # can't gain new privileges
    security_opt:
      - no-new-privileges:true

    environment:
      HOME: /home/agent
      TMPDIR: /tmp

    # Runtime-only writable areas. These disappear when the container stops.
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=1g,mode=1777

    volumes:
      # The container can modify the project folder
      - type: bind
        source: .
        target: /workspace
        read_only: false
        bind:
          create_host_path: false

      # Protected AI development directories
      - type: bind
        source: ./.devcontainer
        target: /workspace/.devcontainer
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ./ai_dev_scripts
        target: /workspace/ai_dev_scripts
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: .git
        target: /workspace/.git
        read_only: true
        bind:
          create_host_path: true

      # Protected AI development files
      - type: bind
        source: ./compose.ai-dev-cold.yml
        target: /workspace/compose.ai-dev-cold.yml
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ./compose.ai-dev-common.yml
        target: /workspace/compose.ai-dev-common.yml
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ./compose.ai-dev-project-bridge.yml
        target: /workspace/compose.ai-dev-project-bridge.yml
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ./compose.ai-dev-with-project.yml
        target: /workspace/compose.ai-dev-with-project.yml
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ./.gitignore
        target: /workspace/.gitignore
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ./.dockerignore
        target: /workspace/.dockerignore
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ./vs_code_ai_dev_workspace.code-workspace
        target: /workspace/vs_code_ai_dev_workspace.code-workspace
        read_only: true
        bind:
          create_host_path: false