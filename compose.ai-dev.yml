services:
  ai_dev:
    build:
      context: ./.devcontainer
      dockerfile: Dockerfile
      args:
        USER_UID: 1000
        USER_GID: 1000

    user: "1000:1000"
    working_dir: /workspace

    command: sleep infinity
    init: true

    # The image's entire root filesystem is read-only.
    read_only: true

    # Do not allow privilege escalation.
    privileged: false

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    environment:
      HOME: /home/vscode
      TMPDIR: /tmp

    volumes:
      # The container can modify the project folder
      - type: bind
        source: .
        target: /workspace
        read_only: false
        bind:
          create_host_path: false

      # The container can modify everything under /home/vscode
      - type: volume
        source: ai_dev_home
        target: /home/vscode

    # Runtime-only writable areas. These disappear when the container stops.
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=1g,mode=1777

volumes:
  ai_dev_home: