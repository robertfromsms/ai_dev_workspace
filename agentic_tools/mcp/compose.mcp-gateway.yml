services:
  searxng:
    image: docker.io/searxng/searxng:2026.7.26-b060c780d
    init: true
    restart: unless-stopped
    environment:
      FORCE_OWNERSHIP: "false"
      SEARXNG_LIMITER: "false"
      SEARXNG_PUBLIC_INSTANCE: "false"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng_cache:/var/cache/searxng
    expose:
      - "8080"
    security_opt:
      - no-new-privileges:true

  mcp_gateway:
    build:
      context: .
      dockerfile: ./Dockerfile.mcp
    init: true
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    privileged: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      HOME: /home/node
      TMPDIR: /tmp
      XDG_CACHE_HOME: /tmp/cache
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=256m,mode=1777
      - /home/node:rw,nosuid,nodev,noexec,size=64m,mode=0700,uid=1000,gid=1000
    volumes:
      # for this entrypoint that may never be used
      - ./docker-mcp-gateway-entrypoint.sh:/etc/mcp-proxy/docker-mcp-gateway-entrypoint.sh:ro
      # servers.json needs to be at /etc/mcp-proxy/ to make sure the mcp-proxy sees the config
      - ./servers.json:/etc/mcp-proxy/servers.json:ro
      # mounting the entire workspace into mcp_gateway service for codegraph, lsp and other stuff
      - type: bind
        source: ../../.
        target: /workspace
        read_only: true
      # using a named volume for codegraph
      - type: volume
        source: codegraph_index
        target: /workspace/.codegraph
    secrets:
      - source: brave_api_key
        target: brave_api_key
        uid: "1000"
        gid: "1000"
        mode: "0400"
    expose:
      - "8080"
    depends_on:
      searxng:
        condition: service_started

secrets:
  brave_api_key:
    file: ${BRAVE_API_KEY_FILE:-./blank_secret}

volumes:
  searxng_cache:
  codegraph_index: