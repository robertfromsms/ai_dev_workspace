services:
  mcp_gateway:
    build:
      context: .
      dockerfile: ./Dockerfile.mcp
    init: true
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    privileged: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      HOME: /home/node
      TMPDIR: /tmp
      XDG_CACHE_HOME: /tmp/cache
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=256m,mode=1777
      - /home/node:rw,nosuid,nodev,noexec,size=64m,mode=0700,uid=1000,gid=1000
    volumes:
      # for this entrypoint that may never be used
      - ./docker-mcp-gateway-entrypoint.sh:/etc/mcp-proxy/docker-mcp-gateway-entrypoint.sh:ro
      # servers.json needs to be at /etc/mcp-proxy/ to make sure the mcp-proxy sees the config
      - ./servers.json:/etc/mcp-proxy/servers.json:ro
      # don't really need to mount the secret_wrappers, but just neatness' sake
      - ./secret_wrappers:/usr/local/bin/secret_wrappers:ro
      # mounting the entire workspace into mcp_gateway (might not need to mount ai_dev_workspace for this service?)
      - type: bind
        source: ../../.
        target: /workspace
        read_only: true
      # mounting your working project into mcp_gateway service for codegraph, lsp and other stuff
      - type: bind
        source: ${WORKING_PROJECT_PATH:?Set WORKING_PROJECT_PATH to the absolute host path of your project}
        target: /workspace/working_project
        read_only: false
        bind:
          create_host_path: false
      # using a named volume for codegraph
      - type: volume
        source: codegraph_index
        target: /workspace/working_project/.codegraph
        read_only: false
      # persistent generated documentation cache for Solargraph
      - type: volume
        source: solargraph_cache
        target: /var/cache/solargraph
    secrets:
      - brave_api_key
      - serply_api_key
    expose:
      - "8080"

secrets:
  brave_api_key:
    file: ${BRAVE_API_KEY_FILE:-./blank_secret}
  serply_api_key:
    file: ${SERPLY_API_KEY_FILE:-./blank_secret}

volumes:
  codegraph_index:
  solargraph_cache:
